name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build:reader
      - run: pnpm -r test
      - run: pnpm -F @paperweave/backend build
      - run: pnpm -F @paperweave/web build

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact-glob: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            artifact-name: paperweave-macos-arm64
          - os: windows-latest
            artifact-glob: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            artifact-name: paperweave-windows-x64
          - os: ubuntu-latest
            artifact-glob: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            artifact-name: paperweave-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Windows: npm/pnpm 脚本走 bash（reader 构建含 POSIX env 语法，cmd 会报 PDFJS_CONFIG 不识别）
        if: runner.os == 'Windows'
        run: |
          npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"
          pnpm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"
      - name: Linux bundling deps (AppImage/deb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install
      - name: Build desktop bundle (reader → web → SEA sidecar → tauri)
        run: bash scripts/build-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-glob }}
          generate_release_notes: true
