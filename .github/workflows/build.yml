name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: Build zotero/reader (web 测试依赖 public/reader 存在与否不大，但保持流程一致)
        run: pnpm build:reader
      - run: pnpm -r test
      - run: pnpm -F @paperweave/backend build
      - run: pnpm -F @paperweave/web build

  dmg:
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install
      - name: Build desktop DMG (reader → web → SEA sidecar → tauri → dmg)
        run: bash scripts/build-desktop.sh
      - name: Locate DMG
        id: dmg
        run: |
          f=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: paperweave-dmg-arm64
          path: ${{ steps.dmg.outputs.path }}
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
